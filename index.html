<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOBOBO | デジタル小動物PoC</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050505;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0,0,0,0.28);
      padding: 12px 14px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      font-weight: 700;
    }
    .sub {
      font-size: 12px;
      opacity: 0.75;
    }
    #controls {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: grid;
      grid-template-columns: repeat(3, 56px);
      gap: 10px;
      z-index: 10;
    }
    .btn {
      width: 56px;
      height: 56px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 24px;
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
      background: rgba(0,123,255,0.25);
      border-color: rgba(0,123,255,0.8);
    }
    .btn.active {
      outline: 2px solid #4da3ff;
      background: rgba(0,123,255,0.35);
    }
    #status {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.28);
      font-size: 13px;
      opacity: 0.9;
    }
    .tweet-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #1d9bf0;
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      pointer-events: auto;
    }
    .tweet-btn:hover {
      background: #1a8cd8;
      transform: scale(1.05);
    }
    .utility-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .utility-btn {
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
    }
    #debug-panel {
      position: fixed;
      z-index: 30;
      top: 12px;
      right: 12px;
      width: min(380px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow: auto;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      background: rgba(4,8,15,0.94);
      font-size: 12px;
    }
    #debug-panel summary { cursor: pointer; font-weight: 700; }
    #debug-panel:not([open]) { width: auto; }
    .debug-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 5px 8px;
      margin: 10px 0;
    }
    .debug-grid output { overflow-wrap: anywhere; color: #a8d8ff; }
    #debug-panel label { display: grid; gap: 4px; }
    #debug-panel input {
      box-sizing: border-box;
      width: 100%;
      padding: 7px;
      border-radius: 6px;
      border: 1px solid #556;
      background: #111826;
      color: #fff;
    }
    .debug-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .debug-actions button { padding: 6px; }
    #debug-message { min-height: 1.4em; margin-top: 7px; color: #ffd54f; }
    @media (max-width: 640px) {
      #ui { top: 10px; left: 10px; max-width: calc(100vw - 20px); }
      #ui h1 { font-size: 16px; }
      #controls {
        right: 10px;
        bottom: 54px;
        grid-template-columns: repeat(6, 42px);
        gap: 5px;
      }
      .btn { width: 42px; height: 42px; font-size: 20px; border-radius: 11px; }
      #status { left: 10px; bottom: 10px; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <h1>BOBOBO</h1>
    <div class="sub">触れたり、そっと見守ったりしてみてください</div>
    <button id="tweet-btn" class="tweet-btn">Tweet Emotion 🐦</button>
    <div class="utility-row">
      <button id="microphone-start" class="utility-btn">音に反応する</button>
      <button id="microphone-stop" class="utility-btn" hidden>マイク停止</button>
    </div>
  </div>

  <div id="controls">
    <button class="btn" data-emotion="joy" title="Joy">😊</button>
    <button class="btn" data-emotion="sad" title="Sad">😢</button>
    <button class="btn" data-emotion="anger" title="Anger">💢</button>
    <button class="btn" data-emotion="surprise" title="Surprise">😲</button>
    <button class="btn" data-emotion="calm" title="Calm">🧘</button>
    <button class="btn" data-emotion="confusion" title="Confusion">❓</button>
  </div>

  <div id="status" aria-live="polite">のんびりしている</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CreatureController } from './src/creature-controller.js';
    import { CreatureAiClient } from './src/ai-client.js';
    import { STATE_LABELS, STATE_TO_EMOTION } from './src/creature-state.js';
    import { createDebugPanel } from './src/debug-panel.js';

    const COLORS = {
      background: 0x050505,
      body: 0xf2f2f2,
      floor: 0x111111,
      grid: 0x2a2a2a
    };

    const EMOTION_CONFIGS = {
      joy:       { body: 0xffee58, light: 0xffd54f, intensity: 70, face: 0x1a1a1a, cheek: 0xff9eb0 },
      sad:       { body: 0x7aa7d9, light: 0x4f7fbf, intensity: 28, face: 0x12243d, cheek: 0x5b88bd },
      anger:     { body: 0xff6b4a, light: 0xff3300, intensity: 90, face: 0x2a0b05, cheek: 0xff5533 },
      surprise:  { body: 0xffffff, light: 0xffffff, intensity: 100, face: 0x111111, cheek: 0xffc1cf },
      calm:      { body: 0xa8d8ff, light: 0x66bfff, intensity: 36, face: 0x122232, cheek: 0x89b9da },
      confusion: { body: 0xb39ddb, light: 0x8e6cff, intensity: 48, face: 0x231633, cheek: 0xc29bdf }
    };

    let scene, camera, renderer, controls, clock;
    let character, bodyMat, emotionLight;
    let leftEyeMat, rightEyeMat, browMat, mouthMat, cheekMat;
    let currentEmotion = 'calm';
    let pointerNdc = { x: 0, y: 0 };
    let debugPanel = { update() {} };
    let microphone = null;
    let nextAiAt = Date.now() + 60_000 + Math.random() * 30_000;
    const bones = {};
    const base = {};
    const face = {};
    const raycaster = new THREE.Raycaster();
    const aiClient = new CreatureAiClient();
    const creature = new CreatureController({
      onChange: updateLifeDisplay
    });

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(COLORS.background);
      scene.fog = new THREE.Fog(COLORS.background, 10, 28);

      camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(2.8, 1.8, 4.8);

      const params = new URLSearchParams(window.location.search);
      if (params.has('emotion')) {
        const emo = params.get('emotion');
        if (EMOTION_CONFIGS[emo]) currentEmotion = emo;
      } else {
        currentEmotion = creature.currentEmotion;
      }

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 1.2, 0);

      clock = new THREE.Clock();

      const ambient = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambient);

      const key = new THREE.DirectionalLight(0xffffff, 1.0);
      key.position.set(4, 8, 4);
      key.castShadow = true;
      scene.add(key);

      emotionLight = new THREE.PointLight(0x66bfff, 36, 20, 2);
      emotionLight.position.set(1.8, 3.0, 1.5);
      scene.add(emotionLight);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.MeshStandardMaterial({ color: COLORS.floor, roughness: 0.95 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(40, 40, COLORS.grid, COLORS.grid);
      scene.add(grid);

      createCharacter();
      setupButtons();
      updateEmotionStyle();
      setupCreatureLife();

      document.getElementById('tweet-btn').addEventListener('click', () => {
        const baseUrl = 'https://kg-ninja.github.io/BOBOBO/';
        const shareUrl = `${baseUrl}?emotion=${currentEmotion}`;
        const text = `今のボボボの感情は「${currentEmotion}」です！`;
        const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareUrl)}&hashtags=BOBOBO,ThreeJS`;
        window.open(twitterUrl, '_blank');
      });

      window.addEventListener('resize', onResize);
    }

    function setupButtons() {
      const buttons = [...document.querySelectorAll('.btn')];
      const emotionToState = {
        joy: 'happy',
        sad: 'lonely',
        anger: 'annoyed',
        surprise: 'startled',
        calm: 'idle',
        confusion: 'curious'
      };
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          creature.addEvent('manual_emotion');
          creature.transition(emotionToState[btn.dataset.emotion], 4000);
        });
        
        if (btn.dataset.emotion === currentEmotion) {
          btn.classList.add('active');
          document.getElementById('status').textContent = `emotion: ${currentEmotion}`;
        }
      });
    }

    function updateLifeDisplay(snapshot = creature.snapshot()) {
      currentEmotion = STATE_TO_EMOTION[snapshot.currentState] || 'calm';
      if (bodyMat) updateEmotionStyle();
      document.querySelectorAll('.btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.emotion === currentEmotion);
      });
      const status = document.getElementById('status');
      if (status) status.textContent = STATE_LABELS[snapshot.currentState] || 'のんびりしている';
      debugPanel.update();
    }

    function setupCreatureLife() {
      let pointerDown = null;
      renderer.domElement.addEventListener('pointerdown', event => {
        pointerDown = { x: event.clientX, y: event.clientY };
      });
      renderer.domElement.addEventListener('pointermove', event => {
        pointerNdc = {
          x: (event.clientX / window.innerWidth) * 2 - 1,
          y: -(event.clientY / window.innerHeight) * 2 + 1
        };
        raycaster.setFromCamera(pointerNdc, camera);
        const near = raycaster.intersectObject(character, true).length > 0;
        creature.setPointer({ ...pointerNdc, near });
      }, { passive: true });
      renderer.domElement.addEventListener('pointerup', event => {
        if (!pointerDown) return;
        const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
        pointerDown = null;
        if (moved > 12) return;
        raycaster.setFromCamera({
          x: (event.clientX / window.innerWidth) * 2 - 1,
          y: -(event.clientY / window.innerHeight) * 2 + 1
        }, camera);
        if (raycaster.intersectObject(character, true).length) creature.handleTap();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) creature.handleHidden();
        else creature.handleVisible();
      });
      window.addEventListener('focus', () => {
        if (!document.hidden) creature.handleVisible();
      });
      window.addEventListener('pagehide', () => creature.emit());

      document.getElementById('microphone-start').addEventListener('click', startMicrophone);
      document.getElementById('microphone-stop').addEventListener('click', stopMicrophone);

      debugPanel = createDebugPanel({ controller: creature, aiClient, onRunAi: runAi });
      updateLifeDisplay();
      const previousVisitAge = Date.now() - creature.memory.lastVisitAt;
      if (previousVisitAge > 10_000) {
        creature.addEvent('page_revisit');
        creature.handleVisible();
      } else {
        creature.addEvent('page_load');
        creature.emit();
      }

      setInterval(() => {
        if (!document.hidden) {
          creature.tick();
          if (Date.now() >= nextAiAt) {
            runAi(false).catch(() => {});
            nextAiAt = Date.now() + 60_000 + Math.random() * 30_000;
          }
        }
      }, 5000);
    }

    async function runAi(manual = false) {
      const result = await aiClient.decide(creature.snapshot(), { manual });
      creature.applyDecision(result);
      debugPanel.update();
      return result;
    }

    async function startMicrophone() {
      const startButton = document.getElementById('microphone-start');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const context = new AudioContext();
        const source = context.createMediaStreamSource(stream);
        const analyser = context.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        const samples = new Uint8Array(analyser.fftSize);
        microphone = { stream, context, analyser, samples, active: true };
        startButton.hidden = true;
        document.getElementById('microphone-stop').hidden = false;
        creature.addEvent('microphone_started');
        creature.emit();
        monitorVolume();
      } catch {
        creature.handleMicrophoneDenied();
        startButton.textContent = 'マイクなしで遊ぶ';
        startButton.disabled = true;
      }
    }

    function monitorVolume() {
      if (!microphone?.active) return;
      microphone.analyser.getByteTimeDomainData(microphone.samples);
      let sum = 0;
      for (const value of microphone.samples) {
        const normalized = (value - 128) / 128;
        sum += normalized * normalized;
      }
      const rms = Math.sqrt(sum / microphone.samples.length);
      if (rms > 0.18) creature.handleLoudSound(rms);
      requestAnimationFrame(monitorVolume);
    }

    function stopMicrophone() {
      if (!microphone) return;
      microphone.active = false;
      microphone.stream.getTracks().forEach(track => track.stop());
      microphone.context.close();
      microphone = null;
      document.getElementById('microphone-start').hidden = false;
      document.getElementById('microphone-stop').hidden = true;
      creature.addEvent('microphone_stopped');
      creature.emit();
    }

    function makeMaterial(color = COLORS.body) {
      return new THREE.MeshStandardMaterial({
        color,
        flatShading: true,
        roughness: 0.8,
        metalness: 0.05
      });
    }

    function makeMesh(w, h, d, color) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, bodyMat);
      mesh.castShadow = true;
      mesh.receiveShadow = false;
      return mesh;
    }

    function makeJoint(name, x = 0, y = 0, z = 0, parent = null) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      bones[name] = g;
      base[name] = {
        px: x, py: y, pz: z,
        rx: 0, ry: 0, rz: 0,
        sx: 1, sy: 1, sz: 1
      };
      if (parent) parent.add(g);
      return g;
    }

    function createCharacter() {
      character = new THREE.Group();
      scene.add(character);

      bodyMat = makeMaterial();

      // root
      const root = makeJoint('root', 0, 0, 0, character);

      // hips
      const hips = makeJoint('hips', 0, 1.0, 0, root);
      hips.add(makeMesh(0.34, 0.18, 0.22));

      // spine
      const abdomen = makeJoint('abdomen', 0, 0.12, 0, hips);
      abdomen.add(offsetMesh(makeMesh(0.28, 0.28, 0.2), 0, 0.14, 0));

      const chest = makeJoint('chest', 0, 0.28, 0, abdomen);
      chest.add(offsetMesh(makeMesh(0.46, 0.38, 0.24), 0, 0.19, 0));

      const neck = makeJoint('neck', 0, 0.40, 0.02, chest);
      neck.add(offsetMesh(makeMesh(0.08, 0.10, 0.08), 0, 0.05, 0));

      const head = makeJoint('head', 0, 0.12, 0.02, neck);
      head.add(offsetMesh(makeMesh(0.24, 0.28, 0.20), 0, 0.14, 0));
      // 顔の向き感
      const nose = makeMesh(0.04, 0.04, 0.04);
      nose.position.set(0, 0.1, 0.12);
      head.add(nose);
      createFaceRig(head);

      // shoulders
      const leftShoulder = makeJoint('leftShoulder', 0.28, 0.28, 0.0, chest);
      leftShoulder.add(offsetMesh(makeMesh(0.10, 0.10, 0.10), 0, 0, 0));
      const rightShoulder = makeJoint('rightShoulder', -0.28, 0.28, 0.0, chest);
      rightShoulder.add(offsetMesh(makeMesh(0.10, 0.10, 0.10), 0, 0, 0));

      // upper arms
      const leftUpperArm = makeJoint('leftUpperArm', 0, -0.04, 0, leftShoulder);
      leftUpperArm.add(offsetMesh(makeMesh(0.10, 0.34, 0.10), 0, -0.17, 0));
      const rightUpperArm = makeJoint('rightUpperArm', 0, -0.04, 0, rightShoulder);
      rightUpperArm.add(offsetMesh(makeMesh(0.10, 0.34, 0.10), 0, -0.17, 0));

      // elbows / lower arms
      const leftElbow = makeJoint('leftElbow', 0, -0.34, 0, leftUpperArm);
      const leftLowerArm = makeJoint('leftLowerArm', 0, 0, 0, leftElbow);
      leftLowerArm.add(offsetMesh(makeMesh(0.08, 0.30, 0.08), 0, -0.15, 0));

      const rightElbow = makeJoint('rightElbow', 0, -0.34, 0, rightUpperArm);
      const rightLowerArm = makeJoint('rightLowerArm', 0, 0, 0, rightElbow);
      rightLowerArm.add(offsetMesh(makeMesh(0.08, 0.30, 0.08), 0, -0.15, 0));

      // hips / legs
      const leftHip = makeJoint('leftHip', 0.11, -0.06, 0, hips);
      const rightHip = makeJoint('rightHip', -0.11, -0.06, 0, hips);

      const leftThigh = makeJoint('leftThigh', 0, 0, 0, leftHip);
      leftThigh.add(offsetMesh(makeMesh(0.14, 0.44, 0.14), 0, -0.22, 0));

      const rightThigh = makeJoint('rightThigh', 0, 0, 0, rightHip);
      rightThigh.add(offsetMesh(makeMesh(0.14, 0.44, 0.14), 0, -0.22, 0));

      const leftKnee = makeJoint('leftKnee', 0, -0.44, 0, leftThigh);
      const leftShin = makeJoint('leftShin', 0, 0, 0, leftKnee);
      leftShin.add(offsetMesh(makeMesh(0.12, 0.42, 0.12), 0, -0.21, 0));

      const rightKnee = makeJoint('rightKnee', 0, -0.44, 0, rightThigh);
      const rightShin = makeJoint('rightShin', 0, 0, 0, rightKnee);
      rightShin.add(offsetMesh(makeMesh(0.12, 0.42, 0.12), 0, -0.21, 0));

      // feet
      const leftFoot = makeJoint('leftFoot', 0, -0.42, 0.03, leftShin);
      leftFoot.add(offsetMesh(makeMesh(0.14, 0.06, 0.24), 0, -0.03, 0.06));
      const rightFoot = makeJoint('rightFoot', 0, -0.42, 0.03, rightShin);
      rightFoot.add(offsetMesh(makeMesh(0.14, 0.06, 0.24), 0, -0.03, 0.06));
    }

    function offsetMesh(mesh, x, y, z) {
      mesh.position.set(x, y, z);
      return mesh;
    }

    function createFaceRig(head) {
      leftEyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.45, metalness: 0.08 });
      rightEyeMat = leftEyeMat.clone();
      browMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.08 });
      mouthMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.35, metalness: 0.08 });
      cheekMat = new THREE.MeshStandardMaterial({ color: 0xffa6bc, transparent: true, opacity: 0.15, roughness: 0.7 });

      face.leftEyePivot = new THREE.Group();
      face.leftEyePivot.position.set(0.062, 0.145, 0.11);
      head.add(face.leftEyePivot);
      face.leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.043, 0.031, 0.012), leftEyeMat);
      face.leftEyePivot.add(face.leftEye);

      face.rightEyePivot = new THREE.Group();
      face.rightEyePivot.position.set(-0.062, 0.145, 0.11);
      head.add(face.rightEyePivot);
      face.rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.043, 0.031, 0.012), rightEyeMat);
      face.rightEyePivot.add(face.rightEye);

      face.leftBrowPivot = new THREE.Group();
      face.leftBrowPivot.position.set(0.062, 0.195, 0.108);
      head.add(face.leftBrowPivot);
      face.leftBrow = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.012, 0.01), browMat);
      face.leftBrowPivot.add(face.leftBrow);

      face.rightBrowPivot = new THREE.Group();
      face.rightBrowPivot.position.set(-0.062, 0.195, 0.108);
      head.add(face.rightBrowPivot);
      face.rightBrow = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.012, 0.01), browMat);
      face.rightBrowPivot.add(face.rightBrow);

      face.mouthPivot = new THREE.Group();
      face.mouthPivot.position.set(0, 0.08, 0.112);
      head.add(face.mouthPivot);
      face.mouth = new THREE.Mesh(new THREE.BoxGeometry(0.072, 0.013, 0.012), mouthMat);
      face.mouthPivot.add(face.mouth);

      face.leftCheek = new THREE.Mesh(new THREE.BoxGeometry(0.048, 0.032, 0.008), cheekMat);
      face.leftCheek.position.set(0.083, 0.105, 0.108);
      head.add(face.leftCheek);
      face.rightCheek = face.leftCheek.clone();
      face.rightCheek.material = face.leftCheek.material.clone();
      face.rightCheek.position.set(-0.083, 0.105, 0.108);
      head.add(face.rightCheek);
    }

    function updateEmotionStyle() {
      const cfg = EMOTION_CONFIGS[currentEmotion];
      bodyMat.color.setHex(cfg.body);
      emotionLight.color.setHex(cfg.light);
      emotionLight.intensity = cfg.intensity;
      leftEyeMat.color.setHex(cfg.face);
      rightEyeMat.color.setHex(cfg.face);
      browMat.color.setHex(cfg.face);
      mouthMat.color.setHex(cfg.face);
      cheekMat.color.setHex(cfg.cheek);
    }

    function resetPose() {
      for (const [name, bone] of Object.entries(bones)) {
        const b = base[name];
        bone.position.set(b.px, b.py, b.pz);
        bone.rotation.set(b.rx, b.ry, b.rz);
        bone.scale.set(b.sx, b.sy, b.sz);
      }
      character.position.set(0, 0, 0);
      character.rotation.set(0, 0, 0);
      face.leftEye.scale.set(1, 1, 1);
      face.rightEye.scale.set(1, 1, 1);
      face.leftEyePivot.rotation.set(0, 0, 0);
      face.rightEyePivot.rotation.set(0, 0, 0);
      face.leftBrowPivot.rotation.set(0, 0, 0);
      face.rightBrowPivot.rotation.set(0, 0, 0);
      face.leftBrowPivot.position.y = 0.195;
      face.rightBrowPivot.position.y = 0.195;
      face.mouth.scale.set(1, 1, 1);
      face.mouthPivot.position.y = 0.08;
      face.leftCheek.scale.set(1, 1, 1);
      face.rightCheek.scale.set(1, 1, 1);
      face.leftCheek.material.opacity = 0.15;
      face.rightCheek.material.opacity = 0.15;
    }

    function snap(v, power = 1.0) {
      return Math.tanh(v * power);
    }

    // アニメ調の「溜め→一気に解放」感をつくるカーブ
    function holdBurst(t, freq = 1.0, holdRatio = 0.72) {
      const phase = (t * freq) % 1;
      if (phase < holdRatio) return -1;
      const k = (phase - holdRatio) / (1 - holdRatio);
      return -1 + Math.sin(k * Math.PI) * 2;
    }

    function applyEmotionPose(t) {
      const s = Math.sin;
      const a = Math.abs;

      switch (currentEmotion) {
        case 'joy': {
          const hop = a(s(t * 7.4));
          const punch = snap(s(t * 10.5), 2.3);
          const burst = holdBurst(t, 2.4, 0.68);
          character.position.y = hop * 0.33;
          character.rotation.z = s(t * 7.4) * 0.05;
          bones.chest.rotation.z = s(t * 7.4) * 0.13;
          bones.chest.rotation.x = -0.08 + burst * 0.04;
          bones.leftShoulder.rotation.z = 2.25 + s(t * 14.0) * 0.45;
          bones.rightShoulder.rotation.z = -2.25 - s(t * 14.0) * 0.45;
          bones.leftElbow.rotation.x = -0.9;
          bones.rightElbow.rotation.x = -0.9;
          bones.leftThigh.rotation.x = -hop * 0.30;
          bones.rightThigh.rotation.x = -hop * 0.30;
          bones.neck.rotation.x = -0.1 + punch * 0.05;
          bones.head.rotation.z = s(t * 9.0) * 0.08;
          face.leftEye.scale.y = 0.5 + hop * 0.3;
          face.rightEye.scale.y = 0.5 + hop * 0.3;
          face.mouth.scale.set(1.2, 1.4 + hop * 0.5, 1);
          face.leftBrowPivot.position.y += 0.004 + hop * 0.01;
          face.rightBrowPivot.position.y += 0.004 + hop * 0.01;
          face.leftCheek.material.opacity = 0.40;
          face.rightCheek.material.opacity = 0.40;
          face.leftCheek.scale.set(1.2, 1.1, 1);
          face.rightCheek.scale.set(1.2, 1.1, 1);
          face.leftEyePivot.rotation.z = s(t * 11.0) * 0.08;
          face.rightEyePivot.rotation.z = -s(t * 11.0) * 0.08;
          break;
        }

        case 'sad': {
          character.position.y = -0.08;
          bones.abdomen.rotation.x = 0.28;
          bones.chest.rotation.x = 0.22;
          bones.neck.rotation.x = 0.42;
          bones.head.rotation.x = 0.16;
          bones.leftShoulder.rotation.x = 0.34;
          bones.rightShoulder.rotation.x = 0.34;
          bones.leftShoulder.rotation.z = 0.16;
          bones.rightShoulder.rotation.z = -0.16;
          const breathe = 1.0 + s(t * 1.6) * 0.03;
          bones.chest.scale.set(1, breathe, 1);
          face.leftEye.scale.y = 0.38 + s(t * 1.6) * 0.03;
          face.rightEye.scale.y = 0.38 + s(t * 1.6) * 0.03;
          face.mouth.scale.set(0.8, 0.7, 1);
          face.mouthPivot.position.y -= 0.007;
          face.leftBrowPivot.rotation.z = -0.25;
          face.rightBrowPivot.rotation.z = 0.25;
          face.leftBrowPivot.position.y -= 0.01;
          face.rightBrowPivot.position.y -= 0.01;
          face.leftCheek.material.opacity = 0.08;
          face.rightCheek.material.opacity = 0.08;
          break;
        }

        case 'anger': {
          const shake = snap(s(t * 32.0), 3.0);
          const slam = holdBurst(t, 3.2, 0.75);
          character.position.x = shake * 0.024;
          character.position.z = a(shake) * 0.02;
          character.rotation.y = shake * 0.05;
          bones.chest.rotation.y = shake * 0.09;
          bones.chest.rotation.x = 0.08 + slam * 0.06;
          bones.abdomen.rotation.x = -0.08;
          bones.neck.rotation.x = -0.12;
          bones.leftShoulder.rotation.x = -1.15;
          bones.rightShoulder.rotation.x = -1.15;
          bones.leftElbow.rotation.x = -1.75;
          bones.rightElbow.rotation.x = -1.75;
          bones.leftUpperArm.rotation.z = 0.14;
          bones.rightUpperArm.rotation.z = -0.14;
          bones.leftThigh.rotation.x = 0.08;
          bones.rightThigh.rotation.x = 0.08;
          bones.head.rotation.y = shake * 0.12;
          face.leftEye.scale.y = 0.28;
          face.rightEye.scale.y = 0.28;
          face.leftBrowPivot.rotation.z = 0.34;
          face.rightBrowPivot.rotation.z = -0.34;
          face.leftBrowPivot.position.y -= 0.014;
          face.rightBrowPivot.position.y -= 0.014;
          face.mouth.scale.set(1.3, 0.65 + a(shake) * 0.2, 1);
          face.mouthPivot.position.y -= 0.002;
          face.leftCheek.material.opacity = 0.22 + a(shake) * 0.1;
          face.rightCheek.material.opacity = 0.22 + a(shake) * 0.1;
          bones.leftFoot.rotation.x = -0.08 - a(slam) * 0.08;
          bones.rightFoot.rotation.x = -0.08 - a(slam) * 0.08;
          break;
        }

        case 'surprise': {
          const shock = a(s(t * 10.0));
          const recoil = holdBurst(t, 2.0, 0.66);
          character.position.z = s(t * 10.0) * 0.075;
          character.position.y = shock * 0.15;
          character.rotation.x = recoil * 0.04;
          bones.abdomen.rotation.x = -0.10;
          bones.neck.rotation.x = -0.32;
          bones.head.rotation.x = -0.14;
          bones.leftShoulder.rotation.z = 1.0;
          bones.rightShoulder.rotation.z = -1.0;
          bones.leftElbow.rotation.x = -0.25;
          bones.rightElbow.rotation.x = -0.25;
          face.leftEye.scale.y = 1.7 + shock * 0.6;
          face.rightEye.scale.y = 1.7 + shock * 0.6;
          face.leftEye.scale.x = 0.9;
          face.rightEye.scale.x = 0.9;
          face.leftBrowPivot.position.y += 0.02 + shock * 0.01;
          face.rightBrowPivot.position.y += 0.02 + shock * 0.01;
          face.mouth.scale.set(0.6, 2.2 + shock * 0.6, 1);
          face.mouthPivot.position.y -= 0.01;
          face.leftCheek.material.opacity = 0.16;
          face.rightCheek.material.opacity = 0.16;
          bones.leftShoulder.rotation.x = -0.22 + recoil * 0.08;
          bones.rightShoulder.rotation.x = -0.22 + recoil * 0.08;
          break;
        }

        case 'calm': {
          bones.abdomen.rotation.y = s(t * 1.3) * 0.14;
          bones.chest.rotation.y = s(t * 1.3) * 0.10;
          bones.leftShoulder.rotation.z = 0.08 + s(t * 1.3) * 0.03;
          bones.rightShoulder.rotation.z = -0.08 - s(t * 1.3) * 0.03;
          const breathe = 1.0 + s(t * 1.3) * 0.04;
          bones.chest.scale.set(breathe, breathe, breathe);
          bones.head.rotation.y = s(t * 1.0) * 0.05;
          face.leftEye.scale.y = 0.8 + s(t * 1.3) * 0.05;
          face.rightEye.scale.y = 0.8 + s(t * 1.3) * 0.05;
          face.leftBrowPivot.rotation.z = s(t * 1.2) * 0.05;
          face.rightBrowPivot.rotation.z = -s(t * 1.2) * 0.05;
          face.mouth.scale.set(1.0, 0.9 + s(t * 1.3) * 0.03, 1);
          face.leftCheek.material.opacity = 0.12;
          face.rightCheek.material.opacity = 0.12;
          break;
        }

        case 'confusion': {
          const wobble = holdBurst(t, 1.3, 0.62);
          bones.head.rotation.z = s(t * 2.8) * 0.32;
          bones.head.rotation.y = s(t * 1.7) * 0.12;
          bones.neck.rotation.z = s(t * 2.8) * 0.10;
          bones.chest.rotation.y = s(t * 1.8) * 0.08 + wobble * 0.06;
          bones.rightShoulder.rotation.x = -1.45;
          bones.rightUpperArm.rotation.y = -0.95;
          bones.rightElbow.rotation.x = -1.15;
          bones.leftShoulder.rotation.z = 0.12;
          bones.leftElbow.rotation.x = -0.15;
          face.leftEyePivot.rotation.z = s(t * 2.8) * 0.08;
          face.rightEyePivot.rotation.z = -s(t * 2.8) * 0.08;
          face.leftBrowPivot.rotation.z = -0.30 + s(t * 2.8) * 0.1;
          face.rightBrowPivot.rotation.z = 0.18 - s(t * 2.8) * 0.1;
          face.leftBrowPivot.position.y += 0.004;
          face.rightBrowPivot.position.y -= 0.01;
          face.mouth.scale.set(0.95, 0.72 + a(s(t * 2.8)) * 0.25, 1);
          face.mouthPivot.position.y -= 0.003;
          face.leftCheek.material.opacity = 0.2;
          face.rightCheek.material.opacity = 0.09;
          break;
        }
      }
    }

    function applyCreatureStatePose(t) {
      const state = creature.currentState;
      if (state === 'sleeping') {
        character.position.y -= 0.72;
        character.rotation.z = Math.PI / 2;
        bones.leftShoulder.rotation.z = 0.55;
        bones.rightShoulder.rotation.z = -0.55;
        bones.leftThigh.rotation.x = -0.5;
        bones.rightThigh.rotation.x = 0.35;
        face.leftEye.scale.y = 0.08;
        face.rightEye.scale.y = 0.08;
      } else if (state === 'sleepy') {
        bones.head.rotation.x += 0.25 + Math.abs(Math.sin(t * 0.8)) * 0.12;
        face.leftEye.scale.y *= 0.35;
        face.rightEye.scale.y *= 0.35;
      } else if (state === 'wandering') {
        const step = Math.sin(t * 4);
        character.position.x += Math.sin(t * 0.45) * 0.7;
        character.rotation.y = Math.sin(t * 0.45) * 0.45;
        bones.leftThigh.rotation.x = step * 0.35;
        bones.rightThigh.rotation.x = -step * 0.35;
        bones.leftShoulder.rotation.x = -step * 0.25;
        bones.rightShoulder.rotation.x = step * 0.25;
      } else if (state === 'watching' || state === 'curious') {
        bones.head.rotation.y += pointerNdc.x * 0.42;
        bones.head.rotation.x += -pointerNdc.y * 0.18;
      } else if (state === 'lonely') {
        bones.head.rotation.y += Math.sin(t * 0.7) * 0.16;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      const t = clock.getElapsedTime();
      resetPose();
      applyEmotionPose(t);
      applyCreatureStatePose(t);

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
